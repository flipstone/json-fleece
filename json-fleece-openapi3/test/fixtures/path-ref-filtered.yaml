openapi: "3.0.1"
info:
  title: Guard
  version: "1.0"
paths:
  # Every field of a path item is optional, so this parses to an empty path
  # item. Selecting only getThings excludes it, so its reference never has to
  # be read.
  /widgets:
    $ref: '#/paths/~1things'
  /things:
    get:
      operationId: getThings
      responses:
        '204':
          description: No content
components: {}
